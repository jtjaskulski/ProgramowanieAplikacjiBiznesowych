version: '3.8'

services:
# Company Intranet (Panel administracyjny)
  company-intranet:
    build:
      context: .
      dockerfile: Company.Intranet/Dockerfile
    container_name: company-intranet
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
#      - ASPNETCORE_URLS=http://+:8084;https://+:8085     
      - ASPNETCORE_URLS=http://+:8084;
#      - ASPNETCORE_HTTPS_PORTS=8085
      - ASPNETCORE_HTTP_PORTS=8084
      - ConnectionStrings__CompanyContext=Server=sqlserver,1433;Database=CompanyContext;User=sa;Password=YourStrong@Password123;TrustServerCertificate=True;MultipleActiveResultSets=true
    ports:
      - "8084:8084"
#      - "8085:8085"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - dev-network
    restart: unless-stopped


  # Company Portal WWW (Strona publiczna)
  company-www:
    build:
      context: .
      dockerfile: Company.PortalWWW/Dockerfile
    container_name: company-www
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8082;
#      - ASPNETCORE_URLS=http://+:8082;https://+:8083
      - ASPNETCORE_HTTP_PORTS=8082
#      - ASPNETCORE_HTTPS_PORTS=8083
      - ConnectionStrings__CompanyContext=Server=sqlserver,1433;Database=CompanyContext;User=sa;Password=YourStrong@Password123;TrustServerCertificate=True;MultipleActiveResultSets=true
    ports:
      - "8082:8082"
      - "8083:8083"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - dev-network
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: company-sqlserver
    environment:
      # Akceptacja licencji
      - ACCEPT_EULA=Y
      
      # Hasło SA (administrator)
      - SA_PASSWORD=YourStrong@Password123
      
      # Edycja SQL Server (Developer = darmowa)
      - MSSQL_PID=Developer
    
    ports:
      # Host:Container
      - "1433:1433"
    
    volumes:
      # Trwałość danych (nie ginie po restart)
      - CompanyInternetowe2026-data:/var/opt/mssql
    
    networks:
      - dev-network
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  dev-network:
    driver: bridge

volumes:
  CompanyInternetowe2026-data: